[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-projects",
    "crates/lenso-capability-projects-collaboration",
    "crates/lenso-capability-projects-admin",
    "crates/lenso-projects-agent-tools-plugin",
    "crates/lenso-projects-agent-web-plugin",
    "crates/lenso-projects-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-projects-plugin"
rust-version = "1.94"

[workspace.dependencies]
lenso-capability-auth = "0.2.0"
lenso-capability-http-endpoint = "0.3.0"
futures = "0.3"
lenso = { version = "0.5.17" }
lenso-capability-agent-tool-provider = { version = "0.2.2" }
lenso-auth-sdk = { version = "0.2.3" }
lenso-capability-access-control = { version = "0.2.0" }
lenso-capability-data-export-source = { version = "0.2.0" }
lenso-capability-organization-membership = { version = "0.2.0" }
lenso-capability-retention-participant = { version = "0.2.0" }
lenso-capability-secrets = { version = "0.1.4" }
lenso-contract-runtime = { version = "0.2.0" }
lenso-kernel = { version = "0.3.5" }
lenso-plugin-authoring = { version = "0.2.0" }
lenso-postgres-kit = { git = "https://github.com/LioRael/lenso-postgres-kit", rev = "2d04625955dffa8f55b02499604f5969e3f5f1c3", features = ["uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
