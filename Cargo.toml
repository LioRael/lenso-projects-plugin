[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-projects",
    "crates/lenso-capability-projects-collaboration",
    "crates/lenso-capability-projects-admin",
    "crates/lenso-projects-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-projects-plugin"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
lenso = { version = "0.5.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "b763a63adc20f1ccc9955e784c0d04c21489126b" }
lenso-auth-sdk = { version = "0.2.1", git = "https://github.com/LioRael/lenso-auth-plugin", rev = "ab242d112a240f41035da471d979fa97bc8d1243" }
lenso-capability-access-control = { version = "0.1.0", git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "0c36e0f10648e8f706212c5b289678e1a204c1ee" }
lenso-capability-data-export-source = { version = "0.1.0", git = "https://github.com/LioRael/lenso-data-export-retention-plugin", rev = "12324a8c24d77ac077ea0c88fe17ce79a6451503" }
lenso-capability-organization-membership = { version = "0.1.0", git = "https://github.com/LioRael/lenso-organization-plugin", rev = "e8f869d7a696e5f55b3b9608c3359af969ae2499" }
lenso-capability-retention-participant = { version = "0.1.0", git = "https://github.com/LioRael/lenso-data-export-retention-plugin", rev = "12324a8c24d77ac077ea0c88fe17ce79a6451503" }
lenso-capability-secrets = { version = "0.1.1", git = "https://github.com/LioRael/lenso-secrets-plugin", rev = "c31aa142ff59b4536e2bf3e9785ccbb5bb5c0e6a" }
lenso-contract-codegen = { version = "0.6.3", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-contract-runtime = { version = "0.1.3", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-postgres-kit = { version = "0.1.0", git = "https://github.com/LioRael/lenso-postgres-kit", rev = "525c1012c789e6f54c3c2fdaf8507a626c93e65f" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time", "uuid"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
