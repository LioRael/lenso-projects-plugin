name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lenso_projects_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lenso_projects_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: ./scripts/check-repository-boundary.sh
      - name: PostgreSQL concurrency and restart acceptance
        env:
          LENSO_PROJECTS_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/lenso_projects_test_ci
        run: >-
          cargo test --locked -p lenso-projects-postgres-plugin
          --features postgres-acceptance
          postgres_tests::concurrent_idempotency_identifier_history_activity_and_restart
          -- --nocapture
